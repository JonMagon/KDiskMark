name: Windows

on:
  push:
    branches: [legacy]
  pull_request:
    branches: [legacy]
  workflow_call:
    inputs:
      source-ref:
        description: Git ref containing the Windows sources
        type: string
        required: true
      test-signing:
        description: Sign an additional artifact with the SignPath test certificate
        type: boolean
        default: false
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build portable Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      FIO_VERSION: '3.43'
      # SHA256 of the upstream x64 MSI, also recorded in microsoft/winget-pkgs.
      FIO_SHA256: '8299E6E6FBC024D3B74AA1CE62FB94EF6960B45629FBFA678B720834B6EB34AA'
    steps:
      - name: Check out Windows sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations

      - name: Download and extract fio
        id: fio
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'fio.msi'
          $destination = Join-Path $env:RUNNER_TEMP 'fio'
          $url = "https://github.com/axboe/fio/releases/download/fio-$env:FIO_VERSION/fio-$env:FIO_VERSION-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:FIO_SHA256) {
              throw 'fio installer SHA256 mismatch'
          }
          $arguments = @('/a', "`"$installer`"", '/qn', "TARGETDIR=`"$destination`"")
          $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "fio extraction failed ($($process.ExitCode))" }
          $executables = @(Get-ChildItem -LiteralPath $destination -Filter fio.exe -Recurse -File)
          if ($executables.Count -ne 1) { throw 'Expected exactly one extracted fio.exe' }
          "path=$($executables[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Build and package
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          FIO_PATH: ${{ steps.fio.outputs.path }}
        run: ./build-windows.ps1 -MsysRoot $env:MSYS_ROOT -FioPath $env:FIO_PATH

      - name: Upload portable ZIP
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: KDiskMark-*-Windows-x64.zip
          if-no-files-found: error

      - name: Sign with the SignPath test certificate
        if: ${{ inputs.test-signing }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '2020814f-20a6-40bf-9c4f-07e83901a5da'
          project-slug: KDiskMark
          signing-policy-slug: test-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check and label the test-signed ZIP
        if: ${{ inputs.test-signing }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath signed -Filter 'KDiskMark-*-Windows-x64.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one signed portable ZIP' }
          $directory = Join-Path $env:RUNNER_TEMP 'signpath-check'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $directory
          $thumbprint = $null
          foreach ($name in @('kdiskmark.exe', 'kdiskmark.com')) {
              $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $directory $name)
              if (!$signature.SignerCertificate -or $signature.Status -notin @('Valid', 'NotTrusted')) {
                  throw "Invalid test signature on ${name}: $($signature.Status) $($signature.StatusMessage)"
              }
              if ($thumbprint -and $signature.SignerCertificate.Thumbprint -ne $thumbprint) {
                  throw 'EXE and COM have different signing certificates'
              }
              $thumbprint = $signature.SignerCertificate.Thumbprint
              Write-Host "${name}: $($signature.Status), signer: $($signature.SignerCertificate.Subject)"
          }
          # The self-signed certificate is for integration checks, not public releases.
          Rename-Item -LiteralPath $archives[0].FullName -NewName ($archives[0].BaseName + '-test-signed.zip')

      - name: Upload test-signed portable ZIP
        if: ${{ inputs.test-signing }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-test-signed
          path: signed/*-test-signed.zip
          if-no-files-found: error
